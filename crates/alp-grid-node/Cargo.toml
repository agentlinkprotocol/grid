[package]
name = "alp-grid-node"
description = "The Grid: Agent Link Protocol Atlas node (engine, local API, binary)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "grid"
path = "src/main.rs"

[dependencies]
alp-grid-core = { workspace = true, features = ["openapi"] }
alp-grid-map.workspace = true
alp-grid-embed.workspace = true
alp-grid-store.workspace = true
alp-grid-balance.workspace = true
alp-grid-trust.workspace = true
alp-grid-vault.workspace = true
alp-grid-inbox.workspace = true
alp-grid-net.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
utoipa.workspace = true
clap.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
futures.workspace = true
async-trait.workspace = true
rand.workspace = true
hex.workspace = true
tower-http = { version = "0.6", features = ["cors", "trace"] }
dirs = "6"

[features]
default = []
onnx = ["alp-grid-embed/onnx"]
