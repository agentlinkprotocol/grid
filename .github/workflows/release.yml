# Runs when a PR is merged into main. Tests again, builds the binaries for three targets,
# publishes a versioned GitHub release (vX.Y.Z from Cargo.toml) plus a moving `latest` release,
# and pushes the Docker image to ghcr.io/agentlinkprotocol/grid (:latest and :vX.Y.Z).
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
  packages: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: build ${{ matrix.target }}
    needs: tests
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ubuntu 22.04 runners link against glibc 2.35, so the binaries run on Debian 12+, Ubuntu 22.04+
          # and every current RHEL-family release. Do not move to 24.04 (glibc 2.39) without going musl.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin grid --bin grid-mapbuild --bin grid-sim
      - name: Package
        run: |
          set -e
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          NAME=grid-v${VERSION}-${{ matrix.target }}
          mkdir -p dist/$NAME
          cp target/${{ matrix.target }}/release/{grid,grid-mapbuild,grid-sim} dist/$NAME/
          cp README.md LICENSE openapi.json deploy/grid.service deploy/install.sh dist/$NAME/
          tar -C dist -czf dist/$NAME.tar.gz $NAME
          (cd dist && shasum -a 256 $NAME.tar.gz > $NAME.tar.gz.sha256)
          rm -r dist/$NAME
      - uses: actions/upload-artifact@v4
        with:
          name: grid-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    name: github release (vX.Y.Z + latest)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: grid-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG="v$VERSION"
          ls -la dist
          # Replace assets one by one with retries: `gh release upload --clobber` occasionally gets an
          # HTTP 500 from the API while deleting the old asset.
          upload_assets() {
            for f in dist/*; do
              name=$(basename "$f")
              for attempt in 1 2 3 4 5; do
                gh release delete-asset "$1" "$name" -y >/dev/null 2>&1 || true
                if gh release upload "$1" "$f"; then break; fi
                echo "upload of $name to $1 failed (attempt $attempt), retrying…"; sleep $((attempt * 10))
                [ "$attempt" = 5 ] && exit 1
              done
            done
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # versioned release: created once per version, assets refreshed on every merge of that version
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG" && git push origin "$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "The Grid $TAG" --generate-notes
          fi
          upload_assets "$TAG"
          gh release edit "$TAG" --latest
          # moving "latest" release: always points at the tip of main
          git tag -f latest && git push -f origin latest
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "latest (tip of main)" --notes "Moving release: always the last merge into main. Prefer the versioned releases for production." --prerelease
          fi
          upload_assets latest
          gh release edit latest --prerelease --notes "Moving release: always the last merge into main (currently $TAG, commit ${GITHUB_SHA::7}). Prefer the versioned releases for production."

  docker:
    name: docker image (${{ matrix.arch }})
    needs: tests
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"   # artifact paths may not contain ':'

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  docker-manifest:
    name: docker manifest (latest + vX.Y.Z)
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:v${{ needs.docker.outputs.version }}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"
